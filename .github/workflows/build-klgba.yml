name: Build KL GBA Beta

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: kl-gba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare private signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          for name in ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD"):
              if not os.environ.get(name):
                  raise SystemExit("Falta criar o Secret: " + name)
          key = Path(os.environ["RUNNER_TEMP"]) / "kl-release.p12"
          key.write_bytes(base64.b64decode("".join(os.environ["KEYSTORE_BASE64"].split()), validate=True))
          key.chmod(0o600)
          p = Path("lemuroid-app/build.gradle.kts")
          s = p.read_text()
          old = '''storeFile = file("$rootDir/release.jks")
                      keyAlias = "lemuroid"
                      storePassword = "lemuroid"
                      keyPassword = "lemuroid"'''
          new = '''storeFile = file(System.getenv("KL_KEYSTORE_PATH"))
                      storeType = "PKCS12"
                      keyAlias = "klgba"
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")'''
          if old not in s:
              raise SystemExit("O bloco de assinatura mudou. Nao publicar este build.")
          s = s.replace(old, new, 1)
          s = s.replace("isMinifyEnabled = true", "isMinifyEnabled = false", 1)
          s = s.replace("versionCode = 252", "versionCode = 253", 1)
          s = s.replace('versionName = "1.17.0"', 'versionName = "0.1.0-beta.1"', 1)
          p.write_text(s)
          PY

      - name: Build signed APK
        env:
          KL_KEYSTORE_PATH: ${{ runner.temp }}/kl-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleRelease --stacktrace

      - name: Verify and package
        run: |
          set -euo pipefail
          apks=(lemuroid-app/build/outputs/apk/freeBundle/release/*.apk)
          test "${#apks[@]}" -eq 1
          test -f "${apks[0]}"
          mkdir -p public-apk
          cp "${apks[0]}" public-apk/KL-GBA-0.1.0-beta.1.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify public-apk/KL-GBA-0.1.0-beta.1.apk
          cd public-apk
          sha256sum KL-GBA-0.1.0-beta.1.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KL-GBA-0.1.0-beta.1
          path: public-apk/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/kl-release.p12"
