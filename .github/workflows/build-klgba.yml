          HQ/VcwIA
          """
          expected = "3691643797d460ec280b9d9722d4a95e246d845b6ffd9e170a750924985501ac"
          stamp = Path("kl-updates/advanced-skins-02.sha256")
          raw = gzip.decompress(base64.b64decode(payload))
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("O codigo foi copiado incompleto. Cole o arquivo inteiro novamente.")
          changes = json.loads(raw)
          paths = []
          for entry in changes:
              name = entry["path"]
              parts = PurePosixPath(name)
              if parts.is_absolute() or ".." in parts.parts or not (name.endswith(".kt") or name == "lemuroid-app/build.gradle.kts"):
                  raise SystemExit("Caminho invalido no pacote de atualizacao.")
              paths.append(name)
          if stamp.exists():
              if stamp.read_text().strip() != expected:
                  raise SystemExit("A marca desta atualizacao mudou. Nao sobrescrever os arquivos.")
              print("Atualizacao 0.2 ja aplicada. Suas edicoes posteriores serao preservadas.")
          else:
              root = Path.cwd().resolve()
              for entry in changes:
                  p = Path(entry["path"])
                  if p.is_symlink() or root not in p.resolve().parents:
                      raise SystemExit("Caminho de arquivo inseguro.")
                  current = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
                  updated = hashlib.sha256(entry["after"].encode()).hexdigest()
                  if current not in (entry["before_sha256"], updated):
                      raise SystemExit("O arquivo mudou desde a versao testada: " + entry["path"] + ". Avise o assistente com esta mensagem.")
              for entry in changes:
                  p = Path(entry["path"])
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(entry["after"])
              stamp.parent.mkdir(parents=True, exist_ok=True)
              stamp.write_text(expected + "\n")
              print("Atualizacao aplicada em", len(changes), "arquivos.")
          temp = Path(os.environ["RUNNER_TEMP"])
          (temp / "kl-update-paths.json").write_text(json.dumps(paths + [str(stamp)]))
          (temp / "kl-source-update.json").write_bytes(raw)
          PYCODE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ler versao do aplicativo
        id: version
        run: |
          python - <<'PYCODE'
          import os, re
          from pathlib import Path
          source = Path("lemuroid-app/build.gradle.kts").read_text()
          name = re.search(r'versionName\s*=\s*"([0-9A-Za-z._-]+)"', source)
          number = re.search(r'versionCode\s*=\s*(\d+)', source)
          if not name or not number:
              raise SystemExit("Nao foi possivel ler a versao do app.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("version=" + name.group(1) + "\n")
              stream.write("code=" + number.group(1) + "\n")
          PYCODE

      - name: Prepare private signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python - <<'PYCODE'
          import os, base64
          from pathlib import Path
          for name in ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD"):
              if not os.environ.get(name):
                  raise SystemExit("Falta criar o Secret: " + name)
          temp = Path(os.environ["RUNNER_TEMP"])
          key = temp / "kl-release.p12"
          key.write_bytes(base64.b64decode("".join(os.environ["KEYSTORE_BASE64"].split()), validate=True))
          key.chmod(0o600)
          p = Path("lemuroid-app/build.gradle.kts")
          s = p.read_text()
          (temp / "kl-gradle-source.kts").write_text(s)
          old = 'storeFile = file("$rootDir/release.jks")\n            keyAlias = "lemuroid"\n            storePassword = "lemuroid"\n            keyPassword = "lemuroid"'
          new = 'storeFile = file(System.getenv("KL_KEYSTORE_PATH"))\n            storeType = "PKCS12"\n            keyAlias = "klgba"\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyPassword = System.getenv("KEYSTORE_PASSWORD")'
          if old not in s:
              raise SystemExit("O bloco de assinatura mudou. Avise o assistente com esta mensagem.")
          p.write_text(s.replace(old, new, 1).replace("isMinifyEnabled = true", "isMinifyEnabled = false", 1))
          PYCODE

      - name: Build signed APK
        env:
          KL_KEYSTORE_PATH: ${{ runner.temp }}/kl-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleRelease --stacktrace

      - name: Verify and package
        id: package
        env:
          KL_VERSION: ${{ steps.version.outputs.version }}
          KL_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apks=(lemuroid-app/build/outputs/apk/freeBundle/release/*.apk)
          test "${#apks[@]}" -eq 1
          test -f "${apks[0]}"
          mkdir -p public-apk
          cp "${apks[0]}" "public-apk/KL-GBA-$KL_VERSION.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "public-apk/KL-GBA-$KL_VERSION.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "public-apk/KL-GBA-$KL_VERSION.apk" > "$RUNNER_TEMP/kl-badging.txt"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          output = (Path(os.environ["RUNNER_TEMP"]) / "kl-badging.txt").read_text()
          checks = ["package: name='com.klgames.klgba'", "versionCode='" + os.environ["KL_VERSION_CODE"] + "'", "versionName='" + os.environ["KL_VERSION"] + "'"]
          if not all(value in output for value in checks):
              raise SystemExit("O APK nao tem o pacote ou a versao esperados.")
          PYCODE
          cp "$RUNNER_TEMP/kl-source-update.json" public-apk/CODIGOS-DA-ATUALIZACAO.json
          cd public-apk
          sha256sum "KL-GBA-$KL_VERSION.apk" > SHA256SUMS.txt

      # Grava somente o codigo validado. A chave privada nunca entra no Git.
      - name: Salvar codigo atualizado no repositorio
        run: |
          python - <<'PYCODE'
          import os, json, subprocess
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          Path("lemuroid-app/build.gradle.kts").write_text((temp / "kl-gradle-source.kts").read_text())
          paths = json.loads((temp / "kl-update-paths.json").read_text())
          subprocess.run(["git", "add", "--", *paths], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode:
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "commit", "-m", "KL GBA 0.2: advanced skins, dark mode and console cheats"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:" + os.environ["GITHUB_REF_NAME"]], check=True)
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          Path("public-apk/FONTE.txt").write_text("https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/commit/" + sha + "\n")
          PYCODE

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.package.outcome == 'success' }}
        with:
          name: KL-GBA-${{ steps.version.outputs.version }}
          path: public-apk/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary key and restore source
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/kl-release.p12"
          if test -f "$RUNNER_TEMP/kl-gradle-source.kts"; then
            cp "$RUNNER_TEMP/kl-gradle-source.kts" lemuroid-app/build.gradle.kts
          fi
