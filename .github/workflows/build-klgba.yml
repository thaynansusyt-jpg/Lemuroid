name: Build KL Play Definitive candidate

on:
  workflow_dispatch:
  push:
    branches: [dev, experiment/dreamcast]

permissions:
  contents: write

concurrency:
  group: kl-gba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check out pinned emulator runtime
        uses: actions/checkout@v4
        with:
          repository: Swordfish90/LibretroDroid
          ref: 0ebd299624bfd51a0a1336dd0a2c56fe7ddbc0e3
          path: kl-runtime-source
          submodules: recursive

      - name: Apply and check Plus runtime fixes
        run: |
          python3 tools/kl-runtime/prepare.py kl-runtime-source
          g++ -std=c++17 -O1 -fsanitize=address,undefined -I tools/kl-runtime tools/kl-runtime/test-audio.cpp -o /tmp/kl-audio-test
          /tmp/kl-audio-test
          g++ -std=c++17 -O1 -fsanitize=address,undefined -I tools/kl-runtime tools/kl-runtime/test-layout.cpp -o /tmp/kl-layout-test
          /tmp/kl-layout-test
          g++ -std=c++17 -I tools/kl-runtime -I kl-runtime-source/libretrodroid/src/main/cpp/libretro/libretro-common/include tools/kl-runtime/test-hw-context.cpp -o /tmp/kl-hw-test
          /tmp/kl-hw-test
          sdkmanager "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Check out pinned experimental GBA cable core
        uses: actions/checkout@v4
        with:
          repository: Aelvryx/mgba-wifi-link
          ref: 9e919b0cfbb93af7d1171570dfc6745d00eeebab
          path: kl-link-source

      - name: Verify real GBA cable and TCP boundaries
        run: |
          python3 tools/kl-link/prepare-core.py kl-link-source
          cmake -S kl-link-source -B kl-link-host -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_LIBRETRO=ON \
            -DBUILD_TEST=OFF -DBUILD_SUITE=OFF -DBUILD_CINEMA=OFF \
            -DBUILD_HEADLESS=OFF -DBUILD_EXAMPLE=OFF -DBUILD_LTO=OFF \
            -DUSE_FFMPEG=OFF -DUSE_LUA=OFF -DENABLE_SCRIPTING=OFF -DUSE_DISCORD_RPC=OFF
          cmake --build kl-link-host --parallel 2 --target mgba_libretro
          gcc -O2 -I kl-link-source/src/platform/libretro -I tools/kl-link \
            tools/kl-link/test-transport.c -o kl-transport-test
          ./kl-transport-test
          gcc -O2 -I kl-link-source/src/platform/libretro tools/kl-link/test-lan.c -ldl -o kl-lan-test
          python3 tools/kl-link/test-lan.py kl-link-host/mgba_libretro.so \
            kl-link-source/tools/gba-link-test-rom/fixtures/gba-link-continuous.gba ./kl-lan-test

      - name: Build dedicated Android ARM64 cable core
        env:
          PKG_CONFIG_LIBDIR: /tmp/kl-empty-pkgconfig
          PKG_CONFIG_PATH: ""
        run: |
          sdkmanager "ndk;27.2.12479018"
          mkdir -p "$PKG_CONFIG_LIBDIR"
          cmake -S kl-link-source -B kl-link-android -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_LIBRETRO=ON \
            -DBUILD_TEST=OFF -DBUILD_SUITE=OFF -DBUILD_CINEMA=OFF \
            -DBUILD_HEADLESS=OFF -DBUILD_EXAMPLE=OFF -DBUILD_LTO=OFF
          cmake --build kl-link-android --parallel 2 --target mgba_libretro
          mkdir -p lemuroid-app/src/main/jniLibs/arm64-v8a
          cp kl-link-android/mgba_libretro.so lemuroid-app/src/main/jniLibs/arm64-v8a/libkl_mgba_link.so
          printf '%s\n' 'mGBA Wi-Fi Link: Aelvryx/mgba-wifi-link@9e919b0cfbb93af7d1171570dfc6745d00eeebab' > "$RUNNER_TEMP/kl-link-source.txt"

      - name: Check out pinned Pokemon wireless core
        uses: actions/checkout@v4
        with:
          repository: libretro/gpsp
          ref: 5819380c2ffb0900219d700a382ee68c464ebb99
          path: kl-wireless-source

      - name: Verify and build Pokemon wireless adapter
        run: |
          set -euo pipefail
          python3 tools/kl-wireless/prepare.py kl-wireless-source
          gcc -O1 -fsanitize=address,undefined -I kl-wireless-source/libretro/libretro-common/include -I tools/kl-wireless tools/kl-wireless/test-transport.c -o /tmp/kl-wireless-test
          /tmp/kl-wireless-test
          toolchain="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make -C kl-wireless-source -j2 platform=arm64 \
            CC="$toolchain/aarch64-linux-android23-clang" \
            CXX="$toolchain/aarch64-linux-android23-clang++"
          cp kl-wireless-source/gpsp_libretro.so lemuroid-app/src/main/jniLibs/arm64-v8a/libkl_gpsp_link.so
          printf '%s\n' 'gpSP: libretro/gpsp@5819380c2ffb0900219d700a382ee68c464ebb99 + tools/kl-wireless/prepare.py' >> "$RUNNER_TEMP/kl-link-source.txt"

      - name: Check out pinned GB and GBC cable core
        uses: actions/checkout@v4
        with:
          repository: libretro/gambatte-libretro
          ref: d9d6cd06382d1ced30de34d56d3609452323dab1
          path: kl-gb-source

      - name: Verify real GB serial hardware and build Android cable
        run: |
          set -euo pipefail
          python3 tools/kl-gb/prepare.py kl-gb-source
          g++ -std=c++17 -O1 -pthread -fsanitize=address,undefined -I tools/kl-gb tools/kl-gb/test-socket.cpp -o /tmp/kl-gb-socket-test
          /tmp/kl-gb-socket-test
          make -C kl-gb-source -j2 HAVE_NETWORK=1
          gcc -O1 -I kl-gb-source/libgambatte/libretro-common/include tools/kl-gb/test-core.c -ldl -o /tmp/kl-gb-core-test
          python3 tools/kl-gb/test-core.py kl-gb-source/gambatte_libretro.so /tmp/kl-gb-core-test
          make -C kl-gb-source clean
          toolchain="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make -C kl-gb-source -j2 HAVE_NETWORK=1 platform=unix \
            CC="$toolchain/aarch64-linux-android23-clang" \
            CXX="$toolchain/aarch64-linux-android23-clang++" \
            LDFLAGS="-static-libstdc++"
          if "$toolchain/llvm-readelf" -d kl-gb-source/gambatte_libretro.so | grep -q 'libc++_shared.so'; then
            echo 'The GB cable must include its own C++ runtime.'
            exit 1
          fi
          cp kl-gb-source/gambatte_libretro.so lemuroid-app/src/main/jniLibs/arm64-v8a/libkl_gambatte_link.so
          printf '%s\n' 'Gambatte: libretro/gambatte-libretro@d9d6cd06382d1ced30de34d56d3609452323dab1 + tools/kl-gb/prepare.py' >> "$RUNNER_TEMP/kl-link-source.txt"

      - name: Check out pinned Dreamcast core
        uses: actions/checkout@v4
        with:
          repository: flyinghead/flycast
          ref: 5aa091fde632fb332c8d8c34e280d62dc951954c
          path: kl-dreamcast-source
          submodules: false

      - name: Build experimental Dreamcast ARM64 with OpenGL ES
        run: |
          set -euo pipefail
          git -C kl-dreamcast-source submodule update --init --recursive --depth 1 core/deps/asio core/deps/libchdr core/deps/tinygettext
          bash tools/kl-dreamcast/build-android.sh kl-dreamcast-source kl-dreamcast-android lemuroid-app/src/main/jniLibs/arm64-v8a/libflycast_libretro_android.so
          printf '%s\n' 'Flycast: flyinghead/flycast@5aa091fde632fb332c8d8c34e280d62dc951954c (v2.7), OpenGL ES, ARM64' >> "$RUNNER_TEMP/kl-link-source.txt"
          cp kl-dreamcast-source/LICENSE "$RUNNER_TEMP/FLYCAST-LICENSE.txt"
          mkdir -p lemuroid-app/src/main/assets/licenses
          cp kl-dreamcast-source/LICENSE lemuroid-app/src/main/assets/licenses/Flycast-GPL.txt
          cp docs/DREAMCAST-EXPERIMENT.md lemuroid-app/src/main/assets/licenses/Flycast-source.md

      - name: Ler versao do aplicativo
        id: version
        run: |
          python - <<'PYCODE'
          import os, re
          from pathlib import Path
          source = Path("lemuroid-app/build.gradle.kts").read_text()
          name = re.search(r'versionName\s*=\s*"([0-9A-Za-z._-]+)"', source)
          number = re.search(r'versionCode\s*=\s*(\d+)', source)
          if not name or not number:
              raise SystemExit("Nao foi possivel ler a versao do app.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("version=" + name.group(1) + "\n")
              stream.write("code=" + number.group(1) + "\n")
          PYCODE

      - name: Prepare private signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python - <<'PYCODE'
          import os, base64
          from pathlib import Path
          for name in ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD"):
              if not os.environ.get(name):
                  raise SystemExit("Falta criar o Secret: " + name)
          temp = Path(os.environ["RUNNER_TEMP"])
          key = temp / "kl-release.p12"
          key.write_bytes(base64.b64decode("".join(os.environ["KEYSTORE_BASE64"].split()), validate=True))
          key.chmod(0o600)
          p = Path("lemuroid-app/build.gradle.kts")
          s = p.read_text()
          (temp / "kl-gradle-source.kts").write_text(s)
          old = 'storeFile = file("$rootDir/release.jks")\n            keyAlias = "lemuroid"\n            storePassword = "lemuroid"\n            keyPassword = "lemuroid"'
          new = 'storeFile = file(System.getenv("KL_KEYSTORE_PATH"))\n            storeType = "PKCS12"\n            keyAlias = "klgba"\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyPassword = System.getenv("KEYSTORE_PASSWORD")'
          if old not in s:
              raise SystemExit("O bloco de assinatura mudou. Avise o assistente com esta mensagem.")
          p.write_text(s.replace(old, new, 1).replace("isMinifyEnabled = true", "isMinifyEnabled = false", 1))
          PYCODE

      - name: Build signed APK
        env:
          KL_KEYSTORE_PATH: ${{ runner.temp }}/kl-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:testFreeBundleReleaseUnitTest :lemuroid-app:assembleFreeBundleRelease --stacktrace

      - name: Verify and package
        id: package
        env:
          KL_VERSION: ${{ steps.version.outputs.version }}
          KL_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apks=(lemuroid-app/build/outputs/apk/freeBundle/release/*.apk)
          test "${#apks[@]}" -eq 1
          test -f "${apks[0]}"
          mkdir -p public-apk
          cp "${apks[0]}" "public-apk/KL-Play-$KL_VERSION.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "public-apk/KL-Play-$KL_VERSION.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "public-apk/KL-Play-$KL_VERSION.apk" > "$RUNNER_TEMP/kl-badging.txt"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          output = (Path(os.environ["RUNNER_TEMP"]) / "kl-badging.txt").read_text()
          checks = ["package: name='com.klgames.klgba'", "versionCode='" + os.environ["KL_VERSION_CODE"] + "'", "versionName='" + os.environ["KL_VERSION"] + "'", "application-label:'KL Play'"]
          if not all(value in output for value in checks):
              raise SystemExit("O APK nao tem o pacote ou a versao esperados.")
          PYCODE
          printf 'https://github.com/%s/commit/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > public-apk/FONTE.txt
          cat "$RUNNER_TEMP/kl-link-source.txt" >> public-apk/FONTE.txt
          printf '%s\n' 'LibretroDroid: Swordfish90/LibretroDroid@0ebd299624bfd51a0a1336dd0a2c56fe7ddbc0e3 + tools/kl-runtime/prepare.py' >> public-apk/FONTE.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "public-apk/KL-Play-$KL_VERSION.apk" > public-apk/ASSINATURA-PUBLICA.txt
          cp "$RUNNER_TEMP/FLYCAST-LICENSE.txt" public-apk/FLYCAST-LICENSE.txt
          for library in libkl_mgba_link.so libkl_gpsp_link.so libkl_gambatte_link.so libflycast_libretro_android.so; do
            unzip -l "public-apk/KL-Play-$KL_VERSION.apk" | grep "lib/arm64-v8a/$library"
          done
          cd public-apk
          sha256sum "KL-Play-$KL_VERSION.apk" > SHA256SUMS.txt

      - name: Publish signed public candidates
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/experiment/dreamcast'
        env:
          GH_TOKEN: ${{ github.token }}
          KL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "v$KL_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$KL_VERSION" public-apk/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'KL Play 1.0.0 rc.4 — Dreamcast experimental' --notes-file docs/DEFINITIVE-RELEASE.md --prerelease
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.package.outcome == 'success' }}
        with:
          name: KL-Play-${{ steps.version.outputs.version }}
          path: public-apk/*
          if-no-files-found: error
          retention-days: 14

      - name: Replace old releases after website switches download
        if: github.ref == 'refs/heads/dev' && !contains(steps.version.outputs.version, 'rc')
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          KL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          switched=false
          for attempt in $(seq 1 80); do
            if curl --fail --silent --max-time 10 --user-agent 'Mozilla/5.0' 'https://kl-gba-play.emilysousa65477.chatgpt.site/api/download-status' -o "$RUNNER_TEMP/kl-site-status.json"; then
              if python - <<'PYCODE'
          import json, os
          from pathlib import Path
          status = json.loads((Path(os.environ['RUNNER_TEMP']) / 'kl-site-status.json').read_text())
          expected = Path('public-apk/SHA256SUMS.txt').read_text().split()[0]
          raise SystemExit(0 if status.get('available') and status.get('version') == os.environ['KL_VERSION'] and status.get('sha256') == expected else 1)
          PYCODE
              then switched=true; break; fi
            fi
            sleep 5
          done
          if test "$switched" != true; then
            echo '::warning::SEGA APK published; old releases retained until the website changes download.'
            exit 0
          fi
          for tag in v0.5.0-rc.1 v0.5.0-plus.1 v0.5.0s-plus.1; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done
          if gh api "repos/$GITHUB_REPOSITORY/releases/403197958" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/403197958"
          fi

      - name: Remove temporary key and restore source
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/kl-release.p12"
          if test -f "$RUNNER_TEMP/kl-gradle-source.kts"; then
            cp "$RUNNER_TEMP/kl-gradle-source.kts" lemuroid-app/build.gradle.kts
          fi
